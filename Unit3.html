<html>
  <head>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
    <title>TMS Web Project</title>
    <style>
   .notes {
    background-attachment: local;
    background-image:
        linear-gradient(to right, white 10px, transparent 10px),
        linear-gradient(to left, white 10px, transparent 10px),
        repeating-linear-gradient(white, white 30px, #ccc 30px, #ccc 31px, white 31px);
    line-height: 31px;
    padding: 8px 10px;
}

  .ltextarea {
  line-height: 2.5em; /* Adjust as needed for line spacing */
  background-image: linear-gradient(to bottom, transparent 2.4em, #ccc 2.4em, #ccc 2.5em, transparent 2.5em);
  background-size: 100% 2.5em; /* Matches line-height */
  background-repeat: repeat-y;
  background-attachment: local;
}

.textarea-container {
    display: flex;
}

.line-numbers {
     line-height: 2.5em;
    width: 30px; /* Adjust as needed */
    text-align: right;
    padding-right: 5px;
    background-color: #f0f0f0;
    overflow-y: hidden; /* To prevent independent scrolling */
}

textarea {
    flex-grow: 1;
    white-space: pre; /* Important for line breaks */
    overflow-y: scroll;
}
    </style>
